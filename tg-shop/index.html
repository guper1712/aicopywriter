<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Polo Store — фон</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,800;1,600&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#030b18; --bg-1:#0a1d3a; --navy:#0b2a5b; --red:#c8102e; --blue:#1f4fa8; --gold:#d8b26e;
    --ink:#f4f1ea; --ink-dim:rgba(244,241,234,.55); --glass:rgba(255,255,255,.06); --glass-br:rgba(255,255,255,.14);
    --blob-a:#1f4fa8; --blob-b:#c8102e; --blob-c:#0e3d8a; --outline:rgba(255,255,255,.06);
  }
  [data-mood="heritage"]{
    --bg-0:#12030a; --bg-1:#2a0812; --blob-a:#c8102e; --blob-b:#0b2a5b; --blob-c:#7a0b1e; --gold:#e6c27a; --outline:rgba(255,220,200,.06);
  }
  [data-mood="day"]{
    --bg-0:#e9edf3; --bg-1:#f7f5f0; --blob-a:#9cb8e8; --blob-b:#f2a2ae; --blob-c:#c9d7ee;
    --ink:#0b1f3f; --ink-dim:rgba(11,31,63,.55); --glass:rgba(255,255,255,.45); --glass-br:rgba(11,31,63,.12); --outline:rgba(11,31,63,.07);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:var(--bg-0);color:var(--ink);font-family:Inter,system-ui,sans-serif}
  body{transition:background .8s ease}

  /* ---------- layered background ---------- */
  .bg{position:fixed;inset:0;overflow:hidden;background:radial-gradient(120% 80% at 50% 0%,var(--bg-1),var(--bg-0) 70%);transition:background .8s ease}
  .layer{position:absolute;inset:0;will-change:transform}

  /* 1. mesh aurora blobs */
  .blobs{filter:blur(60px) saturate(140%);opacity:.75}
  .blob{position:absolute;border-radius:50%;mix-blend-mode:screen;transition:background 1s ease}
  [data-mood="day"] .blob{mix-blend-mode:multiply}
  .b1{width:70vmax;height:70vmax;left:-25vmax;top:-30vmax;background:radial-gradient(circle,var(--blob-a),transparent 65%);animation:drift1 22s ease-in-out infinite alternate}
  .b2{width:60vmax;height:60vmax;right:-30vmax;top:10vh;background:radial-gradient(circle,var(--blob-b),transparent 62%);animation:drift2 26s ease-in-out infinite alternate;opacity:.55}
  .b3{width:80vmax;height:80vmax;left:-10vmax;bottom:-50vmax;background:radial-gradient(circle,var(--blob-c),transparent 65%);animation:drift3 30s ease-in-out infinite alternate}
  @keyframes drift1{to{transform:translate(18vmax,14vmax) scale(1.15)}}
  @keyframes drift2{to{transform:translate(-22vmax,20vmax) scale(.85)}}
  @keyframes drift3{to{transform:translate(12vmax,-16vmax) scale(1.1)}}

  /* 2. canvas: polo field in perspective + light motes */
  #field{position:absolute;inset:0;width:100%;height:100%}

  /* 3. giant outlined wordmark marquee */
  .marquee{position:absolute;left:0;right:0;display:flex;white-space:nowrap;font-family:"Playfair Display",serif;font-weight:800;
    font-size:min(34vw,220px);line-height:1;color:transparent;-webkit-text-stroke:1px var(--outline);letter-spacing:-.02em;pointer-events:none}
  .marquee span{padding-right:.4em;animation:slide 40s linear infinite}
  .m1{top:9vh}
  .m2{top:auto;bottom:18vh;font-style:italic}
  .m2 span{animation-direction:reverse;animation-duration:55s}
  @keyframes slide{to{transform:translateX(-100%)}}

  /* 4. spotlight sweep */
  .sweep{background:conic-gradient(from 200deg at 50% -10%,transparent 0deg,rgba(255,255,255,.07) 12deg,transparent 26deg);
    animation:sweep 9s ease-in-out infinite alternate;transform-origin:50% -10%;mix-blend-mode:overlay}
  [data-mood="day"] .sweep{mix-blend-mode:soft-light}
  @keyframes sweep{from{transform:rotate(-14deg)}to{transform:rotate(18deg)}}

  /* 5. grain + vignette */
  .grain{opacity:.09;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    animation:grain .6s steps(3) infinite}
  @keyframes grain{0%{transform:translate(0,0)}33%{transform:translate(-3%,2%)}66%{transform:translate(2%,-3%)}}
  .vignette{background:radial-gradient(120% 90% at 50% 40%,transparent 50%,rgba(0,0,0,.55))}
  [data-mood="day"] .crest h1{text-shadow:0 8px 30px rgba(11,31,63,.12)}
  [data-mood="day"] .vignette{background:radial-gradient(120% 90% at 50% 40%,transparent 55%,rgba(11,31,63,.12))}

  /* stripe accent: navy / white / red tricolor line at very top */
  .tricolor{position:fixed;top:0;left:0;right:0;height:3px;z-index:5;background:linear-gradient(90deg,var(--navy) 0 33%,#fff 33% 66%,var(--red) 66%);
    transform-origin:left;animation:grow 1.4s cubic-bezier(.7,0,.2,1) .3s both}
  @keyframes grow{from{transform:scaleX(0)}}

  /* ---------- intro splash (shows how the bg opens) ---------- */
  .intro{position:fixed;inset:0;z-index:10;display:grid;place-items:center;pointer-events:none}
  .crest{text-align:center}
  .crest .est{font-size:11px;letter-spacing:.5em;color:var(--gold);opacity:0;animation:fadeUp 1s ease .6s forwards}
  .crest h1{font-family:"Playfair Display",serif;font-weight:800;font-size:clamp(40px,13vw,72px);letter-spacing:.02em;line-height:1.05;margin:10px 0 6px;
    color:var(--ink);perspective:600px;text-shadow:0 10px 40px rgba(0,0,0,.35)}
  .crest h1 .ch{display:inline-block;background:linear-gradient(100deg,var(--ink) 35%,var(--gold) 50%,var(--ink) 65%) 100% 0/300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;opacity:0;transform:translateY(60%) rotateX(-80deg);filter:blur(8px);animation:charIn .9s cubic-bezier(.2,.9,.2,1) forwards,shine 5s ease-in-out 2.4s infinite}
  .crest .sub{font-size:12px;letter-spacing:.35em;color:var(--ink-dim);opacity:0;animation:fadeUp 1s ease 1.4s forwards}
  .crest .line{width:0;height:1px;margin:18px auto 0;background:linear-gradient(90deg,transparent,var(--gold),transparent);animation:line 1.2s ease 1.2s forwards}
  @keyframes charIn{to{opacity:1;transform:none;filter:none}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes line{to{width:160px}}
  @keyframes shine{0%,100%{background-position:100% 0}50%{background-position:0 0}}

  /* ---------- mood switcher (to choose the bg) ---------- */
  .dock{position:fixed;left:0;right:0;margin:0 auto;width:max-content;bottom:calc(20px + env(safe-area-inset-bottom));z-index:20;
    display:flex;gap:4px;padding:5px;border-radius:999px;background:var(--glass);border:1px solid var(--glass-br);
    backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);
    opacity:0;animation:fadeUp .8s ease 2.2s forwards;box-shadow:0 10px 40px rgba(0,0,0,.25)}
  .dock button{position:relative;z-index:1;border:0;background:none;color:var(--ink-dim);font:500 13px Inter,sans-serif;padding:10px 15px;border-radius:999px;cursor:pointer;white-space:nowrap;transition:color .3s}
  .dock button.on{color:var(--ink)}
  .pill{position:absolute;top:5px;bottom:5px;border-radius:999px;background:var(--glass-br);transition:left .5s cubic-bezier(.5,1.6,.4,1),width .5s cubic-bezier(.5,1.6,.4,1)}
  .hint{position:fixed;left:0;right:0;bottom:calc(78px + env(safe-area-inset-bottom));text-align:center;font-size:11px;letter-spacing:.2em;color:var(--ink-dim);z-index:20;opacity:0;animation:fadeUp .8s ease 2.6s forwards}

  /* ripple on tap */
  .ripple{position:fixed;z-index:4;border-radius:50%;pointer-events:none;border:1px solid var(--gold);transform:translate(-50%,-50%) scale(0);animation:ripple 1.1s cubic-bezier(.2,.8,.2,1) forwards}
  @keyframes ripple{to{transform:translate(-50%,-50%) scale(1);opacity:0}}

  @media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}
</style>
</head>
<body data-mood="navy">
<div class="tricolor"></div>

<div class="bg" id="bg">
  <div class="layer blobs" data-depth="18"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>
  <canvas id="field" class="layer"></canvas>
  <div class="layer" data-depth="10">
    <div class="marquee m1"><span>POLO · EST. 1890 · </span><span>POLO · EST. 1890 · </span></div>
    <div class="marquee m2"><span>Heritage Sport · </span><span>Heritage Sport · </span></div>
  </div>
  <div class="layer sweep"></div>
  <div class="layer vignette"></div>
  <div class="layer grain"></div>
</div>

<div class="intro" data-depth="-8" id="intro">
  <div class="crest">
    <div class="est">EST. 1890 · NEW YORK</div>
    <h1 id="wordmark">POLO STORE</h1>
    <div class="sub">TELEGRAM BOUTIQUE</div>
    <div class="line"></div>
  </div>
</div>

<div class="hint">ВЫБЕРИ НАСТРОЕНИЕ ФОНА · КОСНИСЬ ЭКРАНА</div>
<nav class="dock" id="dock">
  <span class="pill" id="pill"></span>
  <button data-m="navy" class="on">Navy Night</button>
  <button data-m="heritage">Heritage</button>
  <button data-m="day">Field Day</button>
</nav>

<script>
(() => {
  const tg = window.Telegram && Telegram.WebApp;
  const haptic = t => { try { tg && tg.HapticFeedback && tg.HapticFeedback.selectionChanged(); } catch(e){} };
  if (tg) { try { tg.ready(); tg.expand(); tg.disableVerticalSwipes && tg.disableVerticalSwipes(); } catch(e){} }

  const moods = {
    navy:     { stripeA:'rgba(20,60,130,.30)', stripeB:'rgba(10,30,70,.10)', line:'rgba(255,255,255,.10)', mote:[216,178,110], header:'#030b18' },
    heritage: { stripeA:'rgba(200,16,46,.22)', stripeB:'rgba(60,5,15,.10)',  line:'rgba(255,220,200,.10)', mote:[230,194,122], header:'#12030a' },
    day:      { stripeA:'rgba(11,42,91,.07)',  stripeB:'rgba(11,42,91,.015)', line:'rgba(11,31,63,.08)',   mote:[200,16,46],   header:'#e9edf3' },
  };
  let mood = moods.navy;

  /* split wordmark into animated letters */
  const wm = document.getElementById('wordmark');
  wm.innerHTML = [...wm.textContent].map((c,i)=>`<span class="ch" style="animation-delay:${.2+i*.06}s">${c===' '?'&nbsp;':c}</span>`).join('');

  /* ---------- canvas: perspective polo field + motes ---------- */
  const cv = document.getElementById('field'), ctx = cv.getContext('2d');
  let W, H, dpr;
  const motes = Array.from({length:70}, () => ({ x:Math.random(), y:Math.random(), z:.3+Math.random()*.7, s:Math.random()*Math.PI*2 }));
  function resize(){ dpr = Math.min(devicePixelRatio||1,2); W = innerWidth; H = innerHeight; cv.width = W*dpr; cv.height = H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); }
  addEventListener('resize', resize); resize();

  let px = 0, py = 0, tx = 0, ty = 0;   // parallax (pointer / gyro)
  function draw(t){
    t /= 1000;
    px += (tx-px)*.06; py += (ty-py)*.06;
    ctx.clearRect(0,0,W,H);
    const hz = H*.64 + py*14, vx = W/2 + px*30;   // horizon & vanishing point

    // mowed-grass stripes rushing toward viewer
    const cam = 1.2, speed = .35, depth = 30;
    for (let i = 0; i < depth; i++){
      const z0 = i + 1 - ((t*speed) % 1) * 1 , z1 = z0 + .5;
      if (z0 <= .2) continue;
      const y0 = hz + (H*.6*cam)/z0, y1 = hz + (H*.6*cam)/z1;
      ctx.fillStyle = (i + Math.floor(t*speed))%2 ? mood.stripeA : mood.stripeB;
      ctx.fillRect(0, y1, W, y0-y1);
    }
    // converging field lines
    ctx.strokeStyle = mood.line; ctx.lineWidth = 1;
    for (let k = -8; k <= 8; k++){
      ctx.beginPath(); ctx.moveTo(vx, hz); ctx.lineTo(vx + k*W*.35, H+40); ctx.stroke();
    }
    // dissolve the field into the horizon (mask, not paint)
    ctx.globalCompositeOperation = 'destination-out';
    const g = ctx.createLinearGradient(0,hz,0,hz+H*.2);
    g.addColorStop(0,'#000'); g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.fillRect(0,hz-1,W,H*.2);
    ctx.globalCompositeOperation = 'source-over';

    // horizon glow line
    const hg = ctx.createLinearGradient(0,0,W,0);
    hg.addColorStop(0,'transparent'); hg.addColorStop(.5,`rgba(${mood.mote},.55)`); hg.addColorStop(1,'transparent');
    ctx.fillStyle = hg; ctx.fillRect(0,hz,W,1);

    // floating light motes (depth parallax)
    for (const m of motes){
      m.y -= .0006*m.z; if (m.y < -.05){ m.y = 1.05; m.x = Math.random(); }
      const x = m.x*W + Math.sin(t*.6+m.s)*12*m.z + px*40*m.z, y = m.y*H + py*30*m.z;
      const a = (.25+.5*Math.sin(t*1.5+m.s)**2)*m.z, r = 1+2.2*m.z;
      ctx.beginPath(); ctx.fillStyle = `rgba(${mood.mote},${a})`;
      ctx.shadowColor = `rgba(${mood.mote},.9)`; ctx.shadowBlur = 8*m.z;
      ctx.arc(x,y,r,0,7); ctx.fill();
    }
    ctx.shadowBlur = 0;

    // DOM parallax layers
    document.querySelectorAll('[data-depth]').forEach(el => {
      const d = +el.dataset.depth; el.style.transform = `translate3d(${px*d}px,${py*d}px,0)`;
    });
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);

  addEventListener('pointermove', e => { tx = e.clientX/W*2-1; ty = e.clientY/H*2-1; });
  addEventListener('deviceorientation', e => {
    if (e.gamma == null) return;
    tx = Math.max(-1,Math.min(1,e.gamma/30)); ty = Math.max(-1,Math.min(1,(e.beta-45)/30));
  });

  /* tap ripple */
  addEventListener('pointerdown', e => {
    if (e.target.closest('.dock')) return;
    const r = document.createElement('div'); r.className = 'ripple';
    r.style.cssText = `left:${e.clientX}px;top:${e.clientY}px;width:260px;height:260px`;
    document.body.appendChild(r); setTimeout(()=>r.remove(),1200); haptic();
  });

  /* mood switcher with springy pill */
  const dock = document.getElementById('dock'), pill = document.getElementById('pill');
  const place = b => { pill.style.left = b.offsetLeft+'px'; pill.style.width = b.offsetWidth+'px'; };
  addEventListener('load', () => place(dock.querySelector('.on')));
  setTimeout(() => place(dock.querySelector('.on')), 300);
  dock.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    dock.querySelectorAll('button').forEach(x=>x.classList.toggle('on', x===b)); place(b);
    document.body.dataset.mood = b.dataset.m; mood = moods[b.dataset.m];
    if (tg){ try { tg.setHeaderColor(mood.header); tg.setBackgroundColor(mood.header); } catch(e){} }
    haptic();
  });
  if (tg){ try { tg.setHeaderColor(mood.header); tg.setBackgroundColor(mood.header); } catch(e){} }
})();
</script>
</body>
</html>
